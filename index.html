<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#050505"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Finanças"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><title>Controle financeiro</title>
<style>
:root{--bg:#050505;--card:#101010;--card2:#171717;--line:#242424;--tx:#f2f2f2;--mut:#8a8a8a;--g:#22c55e;--r:#ef4444;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;background-image:radial-gradient(600px 300px at 80% -10%,rgba(34,197,94,.12),transparent),radial-gradient(500px 300px at 0% 0%,rgba(239,68,68,.08),transparent)}
.w{max-width:760px;margin:0 auto;padding:18px 16px 60px}
.top{display:flex;align-items:center;gap:14px}
.av{width:56px;height:56px;border-radius:50%;background:var(--card2) center/cover;border:2px solid var(--g);cursor:pointer;display:grid;place-items:center;font-size:22px;color:var(--g);flex:none;overflow:hidden}
.hi{font-size:15px;color:var(--mut);line-height:1.4}
.hi b{color:var(--tx);cursor:pointer}
.bal{margin:20px 0;padding:26px 22px;border-radius:22px;background:linear-gradient(145deg,#111,#0a0a0a);border:1px solid var(--line)}
.bal small{color:var(--mut);letter-spacing:.08em;text-transform:uppercase;font-size:11px}
.bal .v{font-size:clamp(34px,10vw,52px);font-weight:700;margin-top:6px;letter-spacing:-.02em}
.pos{color:var(--g)}.neg{color:var(--r)}
.sub{display:flex;gap:18px;margin-top:14px;font-size:13px;color:var(--mut)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
button{font:inherit;cursor:pointer;border:0;color:inherit}
.b{padding:15px;border-radius:14px;font-weight:600;font-size:15px}
.bg{background:var(--g);color:#031a0b}.br{background:var(--r);color:#1c0303}
h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:30px 0 12px;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.row .t{flex:1;min-width:0}.row .t div:first-child{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .t div:last-child{font-size:12px;color:var(--mut)}
.x{background:none;color:var(--mut);font-size:18px;padding:4px 8px}
.empty{color:var(--mut);font-size:14px;text-align:center;padding:18px 0}
.legend{display:grid;gap:8px;margin-top:14px}
.legend div{display:flex;align-items:center;gap:10px;font-size:13px}
.legend span:last-child{margin-left:auto;color:var(--mut)}
.mod{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:flex-end;justify-content:center;z-index:9}
.mod.on{display:flex}
.sheet{background:#0e0e0e;border:1px solid var(--line);border-radius:22px 22px 0 0;width:100%;max-width:560px;padding:20px 18px calc(24px + env(safe-area-inset-bottom,0px));max-height:92%;overflow:auto}
.sheet h3{margin:0 0 14px;font-size:18px}
label{display:block;font-size:12px;color:var(--mut);margin:12px 0 6px}
input,select{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:13px;color:var(--tx);font:inherit;font-size:16px}
.chk{display:flex;gap:10px;align-items:center;margin-top:14px;font-size:14px}
.chk input{width:20px;height:20px}
.sec{background:var(--card2);color:var(--mut);padding:12px;border-radius:12px;width:100%;margin-top:8px}
.tag{font-size:10px;background:#1d1d1d;border:1px solid var(--line);border-radius:6px;padding:2px 6px;color:var(--mut);margin-left:6px}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#050505}}
</style></head><body>
<div class="w" id="app"></div>
<div class="mod" id="mod"><div class="sheet" id="sheet"></div></div>
<input type="file" id="file" accept="image/*" hidden>
<script>
const CATS={out:['Alimentação','Moradia','Transporte','Saúde','Lazer','Educação','Contas','Compras','Outros'],in:['Salário','Freelance','Investimentos','Presente','Venda','Outros']};
const COLORS=['#ef4444','#f97316','#eab308','#f43f5e','#a855f7','#ec4899','#fb7185','#d97706','#9ca3af'];
let S={name:'',photo:'',tx:[],rec:[],custom:{out:[],in:[]}};
try{const d=localStorage.getItem('cf_v1');if(d)S=Object.assign(S,JSON.parse(d))}catch(e){}
const save=()=>{try{localStorage.setItem('cf_v1',JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s);
const brl=n=>n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const ym=d=>d.slice(0,7);
const today=()=>{const d=new Date();return d.toISOString().slice(0,10)};
const cats=t=>[...CATS[t],...S.custom[t]];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function runRec(){ // lança as programações vencidas
  const now=new Date();let ch=false;
  S.rec.forEach(r=>{
    r.gen=r.gen||[];
    let [y,m]=r.start.split('-').map(Number);
    while(y<now.getFullYear()||(y==now.getFullYear()&&m<=now.getMonth()+1)){
      const key=y+'-'+String(m).padStart(2,'0');
      const last=new Date(y,m,0).getDate();
      const day=Math.min(r.day,last);
      const date=key+'-'+String(day).padStart(2,'0');
      if(!r.gen.includes(key)&&date<=today()){S.tx.push({id:Date.now()+Math.random(),type:r.type,amount:r.amount,cat:r.cat,desc:r.desc,date,auto:1});r.gen.push(key);ch=true}
      m++;if(m>12){m=1;y++}
    }
  });
  if(ch)save();
}

function render(){
  const a=$('#app');
  if(!S.name){a.innerHTML=`<div style="min-height:80vh;display:flex;flex-direction:column;justify-content:center;gap:14px"><div style="font-size:34px;font-weight:700">Bem-vindo 👋</div><div class="hi">Como você quer ser chamado?</div><input id="nm" placeholder="Seu nome" autofocus><button class="b bg" onclick="setName()">Começar</button></div>`;return}
  runRec();
  const inn=S.tx.filter(t=>t.type=='in').reduce((s,t)=>s+t.amount,0);
  const out=S.tx.filter(t=>t.type=='out').reduce((s,t)=>s+t.amount,0);
  const bal=inn-out;
  const cm=ym(today());
  const month=S.tx.filter(t=>ym(t.date)==cm&&t.type=='out');
  const byCat={};month.forEach(t=>byCat[t.cat]=(byCat[t.cat]||0)+t.amount);
  const ents=Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
  const tot=ents.reduce((s,e)=>s+e[1],0);
  // donut
  let ang=0,paths='';const R=70,C=2*Math.PI*R;
  ents.forEach(([c,v],i)=>{const f=v/tot;paths+=`<circle r="${R}" cx="100" cy="100" fill="none" stroke="${COLORS[i%COLORS.length]}" stroke-width="28" stroke-dasharray="${f*C} ${C}" stroke-dashoffset="${-ang*C}" transform="rotate(-90 100 100)"/>`;ang+=f});
  const donut=ents.length?`<div style="display:flex;justify-content:center"><svg viewBox="0 0 200 200" width="200" height="200">${paths}<text x="100" y="96" text-anchor="middle" fill="#8a8a8a" font-size="11">Saídas do mês</text><text x="100" y="116" text-anchor="middle" fill="#f2f2f2" font-size="15" font-weight="700">${brl(tot)}</text></svg></div><div class="legend">${ents.map(([c,v],i)=>`<div><i class="dot" style="background:${COLORS[i%COLORS.length]}"></i><span>${esc(c)}</span><span>${Math.round(v/tot*100)}% · ${brl(v)}</span></div>`).join('')}</div>`:`<div class="empty">Registre saídas para ver o que mais consome seu dinheiro.</div>`;
  // barras 6 meses
  const ms=[];const n=new Date();for(let i=5;i>=0;i--){const d=new Date(n.getFullYear(),n.getMonth()-i,1);ms.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'))}
  const data=ms.map(k=>({k,i:S.tx.filter(t=>t.type=='in'&&ym(t.date)==k).reduce((s,t)=>s+t.amount,0),o:S.tx.filter(t=>t.type=='out'&&ym(t.date)==k).reduce((s,t)=>s+t.amount,0)}));
  const mx=Math.max(1,...data.map(d=>Math.max(d.i,d.o)));
  const mn=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
  const bars=data.map((d,j)=>{const x=j*54+14;const hi=d.i/mx*110,ho=d.o/mx*110;return `<rect x="${x}" y="${130-hi}" width="16" height="${hi}" rx="4" fill="#22c55e"/><rect x="${x+19}" y="${130-ho}" width="16" height="${ho}" rx="4" fill="#ef4444"/><text x="${x+17}" y="148" text-anchor="middle" fill="#8a8a8a" font-size="10">${mn[+d.k.slice(5)-1]}</text>`}).join('');
  const list=[...S.tx].sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id).slice(0,30);
  a.innerHTML=`
  <div class="top"><div class="av" id="av" style="${S.photo?`background-image:url(${S.photo})`:''}">${S.photo?'':'📷'}</div>
  <div class="hi">Olá, <b onclick="editName()">${esc(S.name)}</b><br>esse é seu saldo disponível</div></div>
  <div class="bal"><small>Saldo disponível</small><div class="v ${bal>=0?'pos':'neg'}">${brl(bal)}</div>
  <div class="sub"><span class="pos">↑ ${brl(inn)}</span><span class="neg">↓ ${brl(out)}</span></div></div>
  <div class="acts"><button class="b bg" onclick="openTx('in')">+ Entrada</button><button class="b br" onclick="openTx('out')">− Saída</button></div>
  <h2>Para onde vai seu dinheiro</h2><div class="card">${donut}</div>
  <h2>Entradas × saídas (6 meses)</h2><div class="card"><svg viewBox="0 0 330 156" width="100%">${bars}</svg></div>
  <h2>Programados</h2><div class="card">${S.rec.length?S.rec.map(r=>`<div class="row"><i class="dot" style="background:${r.type=='in'?'var(--g)':'var(--r)'}"></i><div class="t"><div>${esc(r.desc||r.cat)}</div><div>${esc(r.cat)} · todo dia ${r.day}</div></div><b class="${r.type=='in'?'pos':'neg'}">${brl(r.amount)}</b><button class="x" onclick="delRec('${r.id}')">✕</button></div>`).join(''):'<div class="empty">Nenhum lançamento programado. Marque “Repetir todo mês” ao criar um.</div>'}</div>
  <h2>Últimos lançamentos</h2><div class="card">${list.length?list.map(t=>`<div class="row"><i class="dot" style="background:${t.type=='in'?'var(--g)':'var(--r)'}"></i><div class="t"><div>${esc(t.desc||t.cat)}${t.auto?'<span class="tag">programado</span>':''}</div><div>${esc(t.cat)} · ${t.date.split('-').reverse().join('/')}</div></div><b class="${t.type=='in'?'pos':'neg'}">${t.type=='in'?'+':'−'}${brl(t.amount)}</b><button class="x" onclick="delTx('${t.id}')">✕</button></div>`).join(''):'<div class="empty">Nada por aqui ainda.</div>'}</div>`;
  $('#av').onclick=()=>$('#file').click();
}
function setName(){const v=$('#nm').value.trim();if(!v)return;S.name=v;save();render()}
function editName(){const v=prompt('Seu nome:',S.name);if(v&&v.trim()){S.name=v.trim();save();render()}}
$('#file').onchange=e=>{const f=e.target.files[0];if(!f)return;const im=new Image();const u=URL.createObjectURL(f);im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=200;const x=c.getContext('2d');const s=Math.min(im.width,im.height);x.drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,200,200);S.photo=c.toDataURL('image/jpeg',.8);save();render()};im.src=u};
let T='in';
function openTx(t){
  T=t;const isIn=t=='in';
  $('#sheet').innerHTML=`<h3 class="${isIn?'pos':'neg'}">${isIn?'Nova entrada':'Nova saída'}</h3>
  <label>Valor (R$)</label><input id="f_v" type="number" inputmode="decimal" step="0.01" placeholder="0,00">
  <label>${isIn?'De onde veio':'Motivo da saída'}</label><select id="f_c">${cats(t).map(c=>`<option>${esc(c)}</option>`).join('')}<option value="__n">+ Nova categoria…</option></select>
  <label>Descrição (opcional)</label><input id="f_d" placeholder="Ex.: mercado">
  <label>Data</label><input id="f_t" type="date" value="${today()}">
  <label class="chk"><input id="f_r" type="checkbox"> Repetir todo mês (programado)</label>
  <button class="b ${isIn?'bg':'br'}" style="width:100%;margin-top:18px" onclick="addTx()">Salvar</button>
  <button class="sec" onclick="closeM()">Cancelar</button>`;
  $('#mod').classList.add('on');
}
function closeM(){$('#mod').classList.remove('on')}
$('#mod').onclick=e=>{if(e.target.id=='mod')closeM()};
function addTx(){
  const v=parseFloat($('#f_v').value);if(!(v>0)){alert('Informe um valor válido.');return}
  let c=$('#f_c').value;
  if(c=='__n'){c=(prompt('Nome da nova categoria:')||'').trim();if(!c)return;if(!cats(T).includes(c))S.custom[T].push(c)}
  const date=$('#f_t').value||today(),desc=$('#f_d').value.trim();
  if($('#f_r').checked){
    const r={id:String(Date.now()),type:T,amount:v,cat:c,desc,day:+date.slice(8),start:ym(date),gen:[]};
    S.rec.push(r);
  }else S.tx.push({id:Date.now()+Math.random(),type:T,amount:v,cat:c,desc,date});
  save();closeM();render();
}
function delTx(id){if(confirm('Excluir este lançamento?')){S.tx=S.tx.filter(t=>String(t.id)!=id);save();render()}}
function delRec(id){if(confirm('Remover esta programação? Os lançamentos já feitos continuam.')){S.rec=S.rec.filter(r=>r.id!=id);save();render()}}
render();
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script></body></html>
